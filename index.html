<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Between Faces Floating</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Between Faces Floating</h1>
      <div class="top-actions">
        <span id="clip-count" class="muted">尚未載入素材</span>
        <button id="btn-clear" class="ghost" type="button">清除素材</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="panel">
          <h2>1. 上傳素材</h2>
          <label id="drop-zone" for="file-input">
            <span class="drop-main">拖放影片到這裡</span>
            <span class="drop-sub">或 點擊選擇檔案（可多選）</span>
            <input
              id="file-input"
              type="file"
              accept="video/*"
              multiple
              hidden
            />
          </label>
          <div id="file-list" class="file-list"></div>
        </section>

        <section class="panel">
          <h2>2. 控制</h2>
          <div class="ctrl">
            <label>背景色 <input id="bg-color" type="color" value="#0a0a0a" /></label>
          </div>
          <div class="ctrl">
            <label>
              漂浮速度 <span class="val" id="speed-val">0.5x</span>
              <input id="speed" type="range" min="0.2" max="3" step="0.1" value="0.5" />
            </label>
          </div>
          <div class="ctrl">
            <label>
              同屏數量 <span class="val" id="onscreen-val">10</span>
              <input id="onscreen" type="range" min="3" max="60" step="1" value="10" />
            </label>
          </div>
          <div class="ctrl">
            <label>
              輸出時長（秒） <span class="val" id="duration-val">150</span>
              <input id="duration" type="range" min="15" max="300" step="5" value="150" />
            </label>
          </div>
          <div class="ctrl">
            <label>
              素材最小寬（px） <span class="val" id="minw-val">160</span>
              <input id="minw" type="range" min="40" max="600" step="10" value="160" />
            </label>
          </div>
          <div class="ctrl">
            <label>
              素材最大寬（px） <span class="val" id="maxw-val">320</span>
              <input id="maxw" type="range" min="100" max="1200" step="10" value="320" />
            </label>
          </div>
          <div class="ctrl">
            <label>畫布尺寸（投影牆 850×300 cm → 17:6）</label>
            <select id="canvas-preset">
              <option value="1700x600">1700 × 600（17:6 預覽）</option>
              <option value="3400x1200" selected>3400 × 1200（17:6 4 px/cm）</option>
              <option value="4080x1440">4080 × 1440（17:6 4.8 px/cm）</option>
              <option value="5100x1800">5100 × 1800（17:6 6 px/cm ≈ 5K）</option>
              <option value="3840x2160">3840 × 2160（4K UHD 16:9）</option>
              <option value="1920x1080">1920 × 1080（16:9）</option>
              <option value="custom">自訂…</option>
            </select>
            <div class="size-inputs">
              <input id="canvas-w" type="number" min="320" max="7680" step="10" value="3400" />
              <span>×</span>
              <input id="canvas-h" type="number" min="180" max="4320" step="10" value="1200" />
              <span class="muted">px</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>3. 預覽 / 輸出</h2>
          <div class="row">
            <button id="btn-preview" type="button">▶︎ 預覽</button>
            <button id="btn-stop" type="button" class="ghost">■ 停止</button>
          </div>
          <div class="row">
            <label class="inline">
              輸出格式
              <select id="out-format">
                <option value="mp4" selected>mp4（H.264，WebCodecs）</option>
                <option value="mov">mov（H.264，QuickTime 容器）</option>
                <option value="webm">webm（VP9，MediaRecorder）</option>
              </select>
            </label>
          </div>
          <div class="row">
            <button id="btn-export" type="button" class="primary">⬇︎ 匯出影片</button>
          </div>
          <div id="status" class="status"></div>
          <progress id="progress" value="0" max="1" hidden></progress>
        </section>
      </aside>

      <section class="stage">
        <div id="canvas-wrap"></div>
      </section>
    </main>

    <script src="sketch.js"></script>
  </body>
</html>
